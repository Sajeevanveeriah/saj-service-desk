services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: saj_service_desk
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: saj_service_desk
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saj_service_desk -d saj_service_desk"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - service-desk-postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ALLOW_INSECURE: "false"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  service-desk-postgres:
